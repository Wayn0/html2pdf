name: CI
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: html2pdf-linux-x86_64
          path: target/release/html2pdf
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t html2pdf .
      - run: docker run --rm --network none -v "$PWD:/work" html2pdf tests/fixtures/elements.html /tmp/report.pdf --offline

      - run: docker build -f Dockerfile.musl -t html2pdf:musl .
      - run: docker run --rm --network none -v "$PWD:/work" html2pdf:musl tests/fixtures/elements.html /work/musl-smoke.pdf --offline
